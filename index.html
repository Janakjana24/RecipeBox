
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find easy recipes, explore meals, and save your favourite dishes with RecipeBox.">
  <title>RecipeBox | Find Your Next Favourite Meal</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a href="#" class="logo" aria-label="RecipeBox home">🍲 RecipeBox</a>
    <button id="themeToggle" class="theme-btn" type="button" aria-label="Toggle dark mode">🌙</button>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">YOUR DAILY DOSE OF DELICIOUS</p>
      <h1>Find your next<br><span>favourite meal.</span></h1>
      <p class="hero-text">Simple ingredients. Delicious ideas. Happy cooking.</p>

      <form id="searchForm" class="search-box">
        <label class="sr-only" for="searchInput">Search recipes</label>
        <input id="searchInput" type="search" placeholder="Search dosa, pasta, salad..." autocomplete="off">
        <button type="submit">Search</button>
      </form>

      <div class="filters" aria-label="Filter recipes by category">
        <button class="filter active" data-category="All" type="button">All recipes</button>
        <button class="filter" data-category="Breakfast" type="button">🌞 Breakfast</button>
        <button class="filter" data-category="Lunch" type="button">🍛 Lunch</button>
        <button class="filter" data-category="Dinner" type="button">🌙 Dinner</button>
        <button class="filter" data-category="Snacks" type="button">🍿 Snacks</button>
      </div>
    </section>

    <section class="recipes-section" aria-labelledby="recipesHeading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">MADE FOR YOUR CRAVINGS</p>
          <h2 id="recipesHeading">Explore recipes</h2>
        </div>
        <button id="favoritesToggle" class="favorites-toggle" type="button" aria-pressed="false">
          ♡ My favourites <span id="favoriteCount">0</span>
        </button>
      </div>

      <p id="resultCount" class="result-count" aria-live="polite"></p>
      <div id="recipeGrid" class="recipe-grid"></div>
      <p id="emptyMessage" class="empty-message" hidden>
        No recipes found. Try another search! 🍋
      </p>
    </section>
  </main>

  <footer>
    <p>Made with ❤️ and a little bit of spice.</p>
    <p>© 2026 RecipeBox</p>
  </footer>

  <dialog id="recipeDialog" class="recipe-dialog">
    <div id="recipeDetails"></div>
    <button id="closeDialog" class="close-btn" type="button">✕ Close</button>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
